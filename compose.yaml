services:
  

  database:
    image: postgres:14
    hostname: postgres
    ports:
      - "5432:5432"
    healthcheck: 
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    env_file:
      - db.env

    volumes:
      - db_data:/var/lib/postgresql/data
    
    networks:
      - postgres-network

  adminer:
    image: adminer:4.7.6
    container_name: adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    networks:
      - postgres-network
    
  go:
    image: my_go_image
    depends_on:
      database:
        condition: service_healthy
    build: .
    ports: 
    - 9000:9000
    command: ["/api", "${STORAGE_TYPE:-memmory}"]
    networks:
      - postgres-network
    
    
    

volumes:
  db_data:

networks:
  postgres-network:
    driver: bridge